# Tự deploy website lên Cloudflare Workers mỗi khi nhánh main có commit mới (merge PR hoặc push thẳng).
# Cấu hình trong GitHub → Settings → Secrets and variables → Actions:
#   Secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   Variables: NEXT_PUBLIC_SITE_URL (vd https://remmankimdung.diayti.workers.dev)
# AUTH_SECRET không đặt ở đây: nó là secret của Worker (`wrangler secret put AUTH_SECRET`), deploy không ghi đè.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # cho phép bấm chạy tay trong tab Actions

# Không deploy song song: lần sau chờ lần trước chạy xong
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
    steps:
      - name: Kiểm tra cấu hình
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NEXT_PUBLIC_SITE_URL; do
            [ -n "${!v}" ] || { echo "::error::Thiếu $v (GitHub → Settings → Secrets and variables → Actions)"; exit 1; }
          done

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Cài package
        run: npm ci

      # GitHub không có file .env nên Worker BẮT BUỘC phải có secret AUTH_SECRET, thiếu là trang admin không đăng nhập được.
      # (Bản build trên máy vẫn chạy vì OpenNext nhúng .env vào Worker – đừng dựa vào đó.)
      # Không in danh sách secret ra log: nếu lỡ dán giá trị vào ô Name thì log sẽ lộ luôn giá trị đó.
      - name: Kiểm tra AUTH_SECRET của Worker
        run: |
          if ! out=$(npx wrangler secret list 2>&1); then
            echo "$out"
            echo "::error::Không đọc được secret của Worker. Kiểm tra CLOUDFLARE_API_TOKEN và tên Worker trong wrangler.jsonc."
            exit 1
          fi
          if ! grep -q '"name": *"AUTH_SECRET"' <<< "$out"; then
            echo "::error::Worker (tên trong wrangler.jsonc) chưa có secret AUTH_SECRET nên không đăng nhập admin được. Đặt 1 lần ở Dashboard > Worker > Settings > Variables and Secrets > Add: Type = Secret, Name = AUTH_SECRET, Value = chuỗi tạo bằng openssl rand -base64 32. Hoặc chạy: npx wrangler secret put AUTH_SECRET"
            exit 1
          fi

      - name: Kiểm tra kiểu và lint
        run: |
          npm run typecheck
          npm run lint

      - name: Build
        run: npx opennextjs-cloudflare build

      # Migration chạy sau khi build thành công và trước khi deploy, để code mới không chạy trên schema cũ
      - name: Migration D1
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy
        run: npx opennextjs-cloudflare deploy
